[project]
name = "psycare-api"
version = "0.1.0"
description = "API do PsyCare"
authors = [
    {name = "Jonathan Carvalho",email = "jonathan2500@outlook.pt"}
]
requires-python = ">=3.15"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode  = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "black (>=26.10.1,<27.0.0)"
]
